<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChainVote - Blockchain Explorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            CHAINVOTE
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">Dashboard</a>
        </div>
    </nav>

    <div class="container fade-in">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <h2 style="font-size: 2rem;">Blockchain <span class="text-gradient">Explorer</span></h2>
            <button id="verifyBtn" class="btn btn-primary">Verify Chain Integrity</button>
        </div>
        
        <p class="subtitle" style="margin-bottom: 2rem;">This is the public ledger of all votes. Each block is cryptographically linked to the previous one.</p>

        <div id="blockchainList" class="grid" style="gap: 1.5rem;">
            <!-- Blocks will be loaded here -->
        </div>
    </div>

    <!-- Verification Modal -->
    <div id="verifyModal" class="modal">
        <div class="glass-panel modal-content slide-up" style="max-width: 600px; text-align: left;">
            <h2 style="margin-bottom: 1.5rem; color: var(--primary);">Integrity Verification</h2>
            
            <div id="verifyLog" style="background: rgba(0,0,0,0.5); padding: 1.5rem; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.9rem; color: var(--text-muted); max-height: 300px; overflow-y: auto; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.05);">
            </div>
            
            <div id="verifyResult" style="font-size: 1.2rem; font-weight: 600; text-align: center; margin-bottom: 1.5rem; padding: 1rem; border-radius: 8px;"></div>
            
            <div style="text-align: center;">
                <button id="closeVerifyBtn" onclick="closeModal()" class="btn btn-outline" disabled>Close</button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        function loadBlockchain() {
            const chain = JSON.parse(localStorage.getItem('blockchain'));
            const container = document.getElementById('blockchainList');
            container.innerHTML = '';
            
            chain.forEach(b => {
                const div = document.createElement('div');
                div.className = 'glass-panel chain-block slide-up';
                
                const d = new Date(b.timestamp);
                
                div.innerHTML = `
                    <div class="block-header">
                        <strong style="color:var(--primary)">BLOCK #${b.index.toString().padStart(3, '0')}</strong>
                        <span style="color:var(--text-muted); font-size:0.9rem;">${d.toLocaleString()}</span>
                    </div>
                    <div class="block-row">
                        <div class="block-label">Prev Hash:</div>
                        <div class="block-val" style="color:var(--text-muted)">${b.previousHash}</div>
                    </div>
                    <div class="block-row">
                        <div class="block-label">Curr Hash:</div>
                        <div class="block-val">${b.hash}</div>
                    </div>
                    <div class="block-row">
                        <div class="block-label">Tx ID:</div>
                        <div class="block-val" style="color:#fff">${b.txId}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        loadBlockchain();

        document.getElementById('verifyBtn').addEventListener('click', () => {
            const modal = document.getElementById('verifyModal');
            const logBox = document.getElementById('verifyLog');
            const resultBox = document.getElementById('verifyResult');
            const closeBtn = document.getElementById('closeVerifyBtn');
            
            modal.style.display = 'flex';
            logBox.innerHTML = '';
            resultBox.style.display = 'none';
            closeBtn.style.display = 'none';
            
            const chain = JSON.parse(localStorage.getItem('blockchain'));
            let i = 0;
            let isValid = true;
            
            function scanNext() {
                if (i < chain.length) {
                    const b = chain[i];
                    logBox.innerHTML += `<div>Scanning Block #${b.index.toString().padStart(3,'0')}... OK</div>`;
                    logBox.scrollTop = logBox.scrollHeight;
                    
                    // Simple simulated verify logic based on prev hash link
                    if (i > 0 && chain[i].previousHash !== chain[i-1].hash) {
                        isValid = false;
                    }
                    
                    i++;
                    setTimeout(scanNext, 300); // Animation delay
                } else {
                    logBox.innerHTML += `<div style="color:var(--primary); margin-top:1rem;">Checking Hash Relationships...</div>`;
                    setTimeout(() => {
                        logBox.innerHTML += `<div>Verifying Chain Integrity...</div>`;
                        logBox.scrollTop = logBox.scrollHeight;
                        setTimeout(() => showResult(isValid), 500);
                    }, 500);
                }
            }
            scanNext();
        });

        function showResult(isValid) {
            const resultBox = document.getElementById('verifyResult');
            const closeBtn = document.getElementById('closeVerifyBtn');
            
            resultBox.style.display = 'block';
            closeBtn.style.display = 'inline-block';
            
            if (isValid) {
                resultBox.innerHTML = `
                    <div style="font-size:3rem; color:var(--success); margin-bottom:1rem;">✓</div>
                    <div style="color:var(--success)">BLOCKCHAIN VERIFIED</div>
                    <div style="font-size:0.9rem; color:var(--text-muted); margin-top:0.5rem; font-weight:normal;">All blocks are correctly linked and no tampering was detected.</div>
                `;
            } else {
                resultBox.innerHTML = `
                    <div style="font-size:3rem; color:var(--danger); margin-bottom:1rem;">⚠</div>
                    <div style="color:var(--danger)">INTEGRITY FAILURE</div>
                    <div style="font-size:0.9rem; color:var(--text-muted); margin-top:0.5rem; font-weight:normal;">Blockchain validation detected a modified block.</div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('verifyModal').style.display = 'none';
        }
    </script>
</body>
</html>
