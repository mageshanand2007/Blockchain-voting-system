<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChainVote - Voter Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            CHAINVOTE
        </div>
        <div class="nav-links">
            <span style="color: var(--text-muted)">Voter: <span id="userNameDisplay" style="color:white; font-weight:600;"></span></span>
            <a href="#" onclick="logout()" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</a>
        </div>
    </nav>

    <div class="container dashboard-grid fade-in">
        <div class="sidebar glass-panel">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="vote.html">Cast Vote</a>
            <a href="candidates.html">Candidates</a>
            <a href="blockchain.html">Blockchain Verification</a>
        </div>
        
        <div class="main-content">
            <h2 style="margin-bottom: 1.5rem; font-size: 2rem;">Welcome, <span class="text-gradient">Voter</span></h2>
            
            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-bottom: 2rem;">
                <div class="glass-panel">
                    <h3 style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;">Your Vote</h3>
                    <div class="status-badge" style="margin-bottom: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                        <span id="voteStatus">Checking...</span>
                    </div>
                    
                    <h3 style="color: var(--text-muted); font-size: 0.9rem; margin-top: 1rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;">Election Status</h3>
                    <div class="status-badge" style="margin-bottom: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                        <span id="elStatusDot" class="dot"></span>
                        <span id="elStatusText">Loading...</span>
                    </div>
                </div>
                
                <div class="glass-panel">
                    <h3 style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;">Network Status</h3>
                    <div class="status-badge status-live" style="margin-bottom: 1rem;">
                        <span class="dot dot-live"></span> Secure
                    </div>
                    <p style="font-size: 1.5rem; font-weight: 700; color: #fff;"><span id="blockCount">0</span> Blocks</p>
                </div>
            </div>
            
            <div class="glass-panel">
                <h3 style="margin-bottom: 1rem; color: var(--primary);">Quick Actions</h3>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <a href="vote.html" class="btn btn-primary">Proceed to Voting Terminal</a>
                    <a href="candidates.html" class="btn btn-outline">View Candidates</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        const user = checkAuth('VOTER');
        if (user) {
            document.getElementById('userNameDisplay').textContent = user.name + " (" + user.id + ")";
            
            const isLive = isElectionLive();
            const dot = document.getElementById('elStatusDot');
            const txt = document.getElementById('elStatusText');
            if (isLive) {
                dot.className = 'status-dot status-live';
                txt.textContent = 'LIVE';
            } else {
                dot.className = 'status-dot status-closed';
                txt.textContent = 'CLOSED';
                txt.style.color = 'var(--danger)';
            }

            const voteStatus = document.getElementById('voteStatus');
            if (user.hasVoted) {
                voteStatus.textContent = '✓ VOTE CAST';
                voteStatus.style.color = 'var(--success)';
            } else {
                voteStatus.textContent = 'PENDING';
                voteStatus.style.color = 'var(--text-main)';
            }
            
            const chain = JSON.parse(localStorage.getItem('blockchain'));
            document.getElementById('blockCount').textContent = chain.length;
        }
    </script>
</body>
</html>
