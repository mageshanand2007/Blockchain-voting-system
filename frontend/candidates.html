<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChainVote - Candidates</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            CHAINVOTE
        </div>
        <div class="nav-links" id="navLinks">
            <a href="index.html" id="homeBtn">Home</a>
            <a href="login.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">Voter Login</a>
        </div>
    </nav>

    <!-- Public Layout -->
    <div id="publicLayout" class="container fade-in" style="display: none;">
        <h2 style="margin-bottom: 2rem; text-align: center; font-size: 2.5rem;">Official <span class="text-gradient">Candidates</span></h2>
        <div id="candidatesListPublic" class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));"></div>
    </div>

    <!-- Authenticated Layout -->
    <div id="authLayout" class="container dashboard-grid fade-in" style="display: none;">
        <div class="sidebar glass-panel">
            <a href="dashboard.html">Dashboard</a>
            <a href="vote.html">Cast Vote</a>
            <a href="candidates.html" class="active">Candidates</a>
            <a href="blockchain.html">Blockchain Verification</a>
        </div>
        
        <div class="main-content">
            <h2 style="margin-bottom: 2rem; font-size: 2rem;">Official <span class="text-gradient">Candidates</span></h2>
            <div id="candidatesListAuth" class="grid" style="grid-template-columns: 1fr;"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        const user = getCurrentUser();
        if (user && user.role === 'VOTER') {
            document.getElementById('authLayout').style.display = 'grid';
            document.getElementById('publicLayout').style.display = 'none';
            document.getElementById('homeBtn').style.display = 'none';
            renderCands('candidatesListAuth');
        } else {
            document.getElementById('authLayout').style.display = 'none';
            document.getElementById('publicLayout').style.display = 'block';
            renderCands('candidatesListPublic');
        }

        function renderCands(containerId) {
            const candidates = JSON.parse(localStorage.getItem('candidates')) || DEMO_CANDIDATES;
            const container = document.getElementById(containerId);
            
            candidates.forEach(c => {
                const div = document.createElement('div');
                div.className = 'glass-panel candidate-card slide-up';
                div.innerHTML = `
                    <div class="c-symbol">${c.symbol}</div>
                    <h3 style="margin-bottom: 0.5rem; font-size: 1.5rem;">${c.name}</h3>
                    <div class="c-party">${c.party}</div>
                    <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.5;">${c.desc}</p>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
