<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChainVote - Candidates</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .sidebar a {
            padding: 1rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }
        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .candidate-card {
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s;
        }
        .candidate-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .c-symbol {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .c-party {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <span class="logo-icon">⬡</span> CHAINVOTE
        </div>
        <div class="nav-links">
            <a href="index.html" class="btn btn-outline" style="padding: 0.5rem 1rem;" id="homeBtn">Back to Home</a>
        </div>
    </nav>

    <div class="container dashboard-grid fade-in" id="authLayout" style="display: none;">
        <div class="sidebar glass-panel">
            <a href="dashboard.html">Dashboard</a>
            <a href="vote.html">Cast Vote</a>
            <a href="candidates.html" class="active">Candidates</a>
            <a href="blockchain.html">Blockchain Verification</a>
        </div>
        <div class="main-content">
            <h2 style="margin-bottom: 2rem;">Registered Candidates</h2>
            <div class="candidate-grid" id="candidatesListAuth"></div>
        </div>
    </div>
    
    <div class="container fade-in" id="publicLayout">
        <h2 style="margin-bottom: 2rem; text-align: center;">Registered Candidates</h2>
        <div class="candidate-grid" id="candidatesListPublic"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const user = getCurrentUser();
        if (user && user.role === 'VOTER') {
            document.getElementById('authLayout').style.display = 'grid';
            document.getElementById('publicLayout').style.display = 'none';
            document.getElementById('homeBtn').style.display = 'none';
            renderCands('candidatesListAuth');
        } else {
            document.getElementById('authLayout').style.display = 'none';
            document.getElementById('publicLayout').style.display = 'block';
            renderCands('candidatesListPublic');
        }

        function renderCands(containerId) {
            const candidates = JSON.parse(localStorage.getItem('candidates')) || DEMO_CANDIDATES;
            const container = document.getElementById(containerId);
            
            candidates.forEach(c => {
                const div = document.createElement('div');
                div.className = 'glass-panel candidate-card slide-up';
                div.innerHTML = `
                    <div class="c-symbol">${c.symbol}</div>
                    <h3 style="margin-bottom: 0.5rem; font-size: 1.5rem;">${c.name}</h3>
                    <div class="c-party">${c.party}</div>
                    <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.5;">${c.desc}</p>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
