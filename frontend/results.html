<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChainVote - Election Results</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .results-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .result-bar-wrapper {
            margin-bottom: 2rem;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        .bar-bg {
            background: rgba(255,255,255,0.05);
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary) 0%, var(--primary) 100%);
            width: 0%;
            transition: width 1.5s cubic-bezier(0.1, 0.8, 0.2, 1);
            position: relative;
        }
        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .winner-crown {
            color: #ffd700;
            margin-left: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <span class="logo-icon">⬡</span> CHAINVOTE
        </div>
        <div class="nav-links">
            <a href="admin.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">Back to Admin</a>
        </div>
    </nav>

    <div class="container fade-in">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h2>Live Election <span class="text-gradient">Results</span></h2>
            <p class="subtitle" id="electionStatusText">Loading status...</p>
        </div>

        <div class="results-container glass-panel" id="resultsArea">
            <!-- Results injected here -->
        </div>
        
        <div class="grid" style="grid-template-columns: repeat(3, 1fr); margin-top: 2rem; max-width: 800px; margin-left: auto; margin-right: auto;">
            <div class="glass-panel" style="text-align: center; padding: 1rem;">
                <div style="color:var(--text-muted)">Total Voters</div>
                <div id="resTotalVoters" style="font-size:1.5rem; font-weight:bold; color:var(--primary)">0</div>
            </div>
            <div class="glass-panel" style="text-align: center; padding: 1rem;">
                <div style="color:var(--text-muted)">Total Votes</div>
                <div id="resTotalVotes" style="font-size:1.5rem; font-weight:bold; color:var(--primary)">0</div>
            </div>
            <div class="glass-panel" style="text-align: center; padding: 1rem;">
                <div style="color:var(--text-muted)">Participation</div>
                <div id="resParticipation" style="font-size:1.5rem; font-weight:bold; color:var(--primary)">0%</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function loadResults() {
            const state = JSON.parse(localStorage.getItem('election_state'));
            const candidates = JSON.parse(localStorage.getItem('candidates'));
            const users = JSON.parse(localStorage.getItem('users'));
            
            // Calc stats
            let totalVoters = 0;
            let totalVotes = 0;
            for(let k in users) {
                if(users[k].role === 'VOTER') {
                    totalVoters++;
                    if(users[k].hasVoted) totalVotes++;
                }
            }
            
            document.getElementById('resTotalVoters').textContent = totalVoters;
            document.getElementById('resTotalVotes').textContent = totalVotes;
            const partRate = totalVoters > 0 ? ((totalVotes / totalVoters) * 100).toFixed(1) : 0;
            document.getElementById('resParticipation').textContent = partRate + '%';
            
            document.getElementById('electionStatusText').textContent = state.isLive ? 'Voting is currently LIVE.' : 'Election has ENDED. Final Results.';
            
            const resultsData = [];
            let maxVotes = 0;
            
            candidates.forEach(c => {
                const votes = state.results[c.id] || 0;
                if (votes > maxVotes) maxVotes = votes;
                resultsData.push({ ...c, votes });
            });
            
            // Sort by votes
            resultsData.sort((a, b) => b.votes - a.votes);
            
            const container = document.getElementById('resultsArea');
            container.innerHTML = '';
            
            resultsData.forEach((c, index) => {
                const percentage = totalVotes > 0 ? ((c.votes / totalVotes) * 100).toFixed(1) : 0;
                const isWinner = !state.isLive && totalVotes > 0 && c.votes === resultsData[0].votes && index === 0;
                
                const div = document.createElement('div');
                div.className = 'result-bar-wrapper';
                div.innerHTML = `
                    <div class="result-header">
                        <div>
                            ${c.symbol} <strong>${c.name}</strong> <span style="color:var(--text-muted); font-size:0.9rem;">(${c.party})</span>
                            <span class="winner-crown" style="display: ${isWinner ? 'inline' : 'none'}">👑 WINNER</span>
                        </div>
                        <div>
                            <span style="font-weight:bold; color:var(--primary);">${percentage}%</span>
                            <span style="color:var(--text-muted); font-size:0.9rem; margin-left:10px;">(${c.votes} votes)</span>
                        </div>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: 0%" data-target="${percentage}%"></div>
                    </div>
                `;
                container.appendChild(div);
            });
            
            // Trigger animation
            setTimeout(() => {
                document.querySelectorAll('.bar-fill').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-target');
                });
            }, 100);
        }

        loadResults();
        setInterval(loadResults, 5000); // refresh every 5s
    </script>
</body>
</html>
