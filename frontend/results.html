<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChainVote - Election Results</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            CHAINVOTE <span style="font-size: 0.8em; margin-left: 0.5rem; color: var(--text-muted);">RESULTS</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="admin.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">Admin Back</a>
        </div>
    </nav>

    <div class="container fade-in" style="max-width: 900px;">
        <h2 style="text-align: center; font-size: 2.5rem; margin-bottom: 1rem;">Official <span class="text-gradient">Tally</span></h2>
        
        <div id="electionStatusText" style="text-align: center; margin-bottom: 3rem; font-size: 1.2rem;"></div>
        
        <div class="grid" style="grid-template-columns: 1fr 1fr 1fr; margin-bottom: 3rem; text-align: center;">
            <div class="glass-panel" style="padding: 1.5rem;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Total Voters</h3>
                <p id="resTotalVoters" style="font-size: 2.5rem; font-weight: 700; color: #fff;">0</p>
            </div>
            <div class="glass-panel" style="padding: 1.5rem;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Votes Counted</h3>
                <p id="resTotalVotes" style="font-size: 2.5rem; font-weight: 700; color: var(--primary);">0</p>
            </div>
            <div class="glass-panel" style="padding: 1.5rem;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Participation</h3>
                <p id="resParticipation" style="font-size: 2.5rem; font-weight: 700; color: var(--success);">0%</p>
            </div>
        </div>

        <div id="resultsArea" class="glass-panel">
            <h3 style="margin-bottom: 2rem; color: var(--primary);">Candidate Standings</h3>
            <!-- Results will be loaded here -->
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        function loadResults() {
            const state = JSON.parse(localStorage.getItem('election_state'));
            const candidates = JSON.parse(localStorage.getItem('candidates'));
            const users = JSON.parse(localStorage.getItem('users'));
            
            // Calc stats
            let totalVoters = 0;
            let totalVotes = 0;
            for(let k in users) {
                if(users[k].role === 'VOTER') {
                    totalVoters++;
                    if(users[k].hasVoted) totalVotes++;
                }
            }
            
            document.getElementById('resTotalVoters').textContent = totalVoters;
            document.getElementById('resTotalVotes').textContent = totalVotes;
            const partRate = totalVoters > 0 ? ((totalVotes / totalVoters) * 100).toFixed(1) : 0;
            document.getElementById('resParticipation').textContent = partRate + '%';
            
            document.getElementById('electionStatusText').textContent = state.isLive ? 'Voting is currently LIVE.' : 'Election has ENDED. Final Results.';
            
            const resultsData = [];
            let maxVotes = 0;
            
            candidates.forEach(c => {
                const votes = state.results[c.id] || 0;
                if (votes > maxVotes) maxVotes = votes;
                resultsData.push({ ...c, votes });
            });
            
            // Sort by votes
            resultsData.sort((a, b) => b.votes - a.votes);
            
            const container = document.getElementById('resultsArea');
            container.innerHTML = '';
            
            resultsData.forEach((c, index) => {
                const percentage = totalVotes > 0 ? ((c.votes / totalVotes) * 100).toFixed(1) : 0;
                const isWinner = !state.isLive && totalVotes > 0 && c.votes === resultsData[0].votes && index === 0;
                
                const div = document.createElement('div');
                div.className = 'result-bar-wrapper';
                div.innerHTML = `
                    <div class="result-header">
                        <div>
                            ${c.symbol} <strong>${c.name}</strong> <span style="color:var(--text-muted); font-size:0.9rem;">(${c.party})</span>
                            <span class="winner-crown" style="display: ${isWinner ? 'inline' : 'none'}">👑 WINNER</span>
                        </div>
                        <div>
                            <span style="font-weight:bold; color:var(--primary);">${percentage}%</span>
                            <span style="color:var(--text-muted); font-size:0.9rem; margin-left:10px;">(${c.votes} votes)</span>
                        </div>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: 0%" data-target="${percentage}%"></div>
                    </div>
                `;
                container.appendChild(div);
            });
            
            // Trigger animation
            setTimeout(() => {
                document.querySelectorAll('.bar-fill').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-target');
                });
            }, 100);
        }

        loadResults();
        setInterval(loadResults, 5000); // refresh every 5s
    </script>
</body>
</html>
